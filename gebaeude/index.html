<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cdd8de" />
    <title>Bauten</title>
    <script type="module" crossorigin src="../assets/gebaeude-4QCWAnAd.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/boden-Cm2Y_Zfn.js">

  <body>
    <canvas id="leinwand"></canvas>
    <div class="laedt" aria-hidden="true"><span></span></div>

      <div class="gruppe">
        <button id="zurueck" aria-label="Voriger Bau">‹</button>

      </div>
      <div class="gruppe">
        <button id="nacht" aria-pressed="false">Nacht</button>
      </div>
      <div class="gruppe">
        <button data-jahr="fruehling" aria-pressed="false">Frühling</button>
        <button data-jahr="sommer" aria-pressed="true">Sommer</button>
        <button data-jahr="herbst" aria-pressed="false">Herbst</button>
        <button data-jahr="winter" aria-pressed="false">Winter</button>
      </div>
    </nav>
