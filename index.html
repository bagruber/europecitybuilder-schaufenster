<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cdd8de" />
    <title>Schaufenster</title>
    <style>
      :root { --flaeche: #22302b; --tinte: #e8eee8; --leise: #9fb2a8; --akzent: #8cc0a3; --akzent-tinte: #10201a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body { background: #cdd8de; overflow: hidden; font: 600 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
      .leiste {
        position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; align-items: center; gap: 4px; padding: 5px; max-width: calc(100vw - 24px);
        background: var(--flaeche); border-radius: 11px; box-shadow: 0 2px 10px rgb(0 0 0 / 0.18);
      }
      .gruppe { display: flex; gap: 2px; }
      .gruppe + .gruppe { border-left: 1px solid rgb(255 255 255 / 0.12); padding-left: 4px; }
      button {
        appearance: none; border: 0; border-radius: 7px; background: transparent; color: var(--tinte);
        font: inherit; padding: 9px 11px; cursor: pointer; white-space: nowrap;
      }
      button:hover { background: rgb(255 255 255 / 0.08); }
      button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 1px; }
      button[aria-pressed="true"] { background: var(--akzent); color: var(--akzent-tinte); }
      button:disabled { color: var(--leise); cursor: default; }
      .laedt { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity 0.4s; }
      .laedt span { width: 10px; height: 10px; border-radius: 50%; background: var(--flaeche); animation: puls 1s ease-in-out infinite; }
      .fertig .laedt { opacity: 0; }
      @keyframes puls { 50% { transform: scale(1.8); opacity: 0.4; } }
      @media (max-width: 700px) {
        .leiste { flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); }
        .gruppe + .gruppe { border-left: 0; padding-left: 0; }
        button { padding: 9px 8px; font-size: 13px; }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-zAMmoJvT.js"></script>
  </head>
  <body>
    <canvas id="leinwand"></canvas>
    <div class="laedt" aria-hidden="true"><span></span></div>
    <nav class="leiste" aria-label="Werkzeuge">
      <div class="gruppe">
        <button data-werkzeug="kate" aria-pressed="false">Kate</button>
        <button data-werkzeug="haus" aria-pressed="false">Patrizierhaus</button>
        <button data-werkzeug="auf" aria-pressed="false">Ausbauen</button>
        <button data-werkzeug="ab" aria-pressed="false">Abreißen</button>
        <button id="wuerfeln">Würfeln</button>
      </div>
      <div class="gruppe">
        <button id="nacht" aria-pressed="false">Nacht</button>
      </div>
      <div class="gruppe">
        <button data-jahr="fruehling" aria-pressed="false">Frühling</button>
        <button data-jahr="sommer" aria-pressed="true">Sommer</button>
        <button data-jahr="herbst" aria-pressed="false">Herbst</button>
        <button data-jahr="winter" aria-pressed="false">Winter</button>
      </div>
    </nav>
  </body>
</html>
